# Trợ lý AI trên web Planning: thêm khối này vào khối server của planning.hoaphatdungquat.vn (nginx trên 10.192.212.24),
# rồi chạy "nginx -t" và "nginx -s reload". Xem docs/TRO-LY-AI.md mục 4.
#
# Trình duyệt gọi /troly-api/* cùng nguồn với trang; nginx chuyển thẳng sang máy chủ trợ lý. Flask không đụng tới, nên
# không giữ luồng waitress trong lúc AI trả lời. Máy chủ trợ lý chỉ nhận yêu cầu đến từ IP của máy này.
location /troly-api/ {
    proxy_pass https://mcp.hoaphatdungquat.vn/web/;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host mcp.hoaphatdungquat.vn;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;          # câu trả lời hiện dần (SSE): không gom đệm
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    client_max_body_size 64k;
}
